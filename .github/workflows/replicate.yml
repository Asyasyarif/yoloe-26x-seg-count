name: Build and publish to Replicate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Replicate owner/model; leave empty to use REPLICATE_MODEL variable"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: replicate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install CPU contract test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit and public contract tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q --junitxml=reports/tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests
          path: reports/tests.xml

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MODEL_NAME: ${{ inputs.model_name || vars.REPLICATE_MODEL || 'asyasyarif/firmngin-image-counter' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - name: Install checksum-verified Cog CLI
        run: |
          curl --fail --location --retry 3 -o /tmp/cog https://github.com/replicate/cog/releases/download/v0.23.1/cog_Linux_x86_64
          echo 'c6bf4f89278609b4fcde28a59808bd2b51b559022a9178b08492c910d9dc115d  /tmp/cog' | sha256sum --check
          sudo install -m 0755 /tmp/cog /usr/local/bin/cog
          cog --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            weights/yoloe-26x-seg.pt
            mobileclip2_b.ts
          key: yoloe-assets-${{ hashFiles('weights/manifest.json') }}
      - name: Provision and verify pinned model assets
        run: python scripts/prepare_assets.py
      - name: Validate Cog configuration
        run: cog doctor
      - name: Build GPU image on GitHub Actions
        run: cog build -t image-counter:ci
      - name: Test real model offline with two dynamic prompt sets
        run: |
          mkdir -p reports
          docker run --rm --network none --entrypoint python -v "$PWD/reports:/reports" image-counter:ci scripts/verify_offline.py --image examples/sample.jpg --device cpu --image-size 640 --output /reports/offline.json
          docker run --rm --network none --entrypoint python image-counter:ci -m pip freeze > reports/runtime-requirements.txt
      - name: Check publication configuration
        id: publish
        env:
          CLI_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
          API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          if [[ -z "$CLI_TOKEN" ]]; then
            echo '::error::Build passed, but push cannot authenticate. Set repository secret REPLICATE_CLI_AUTH_TOKEN.'
            echo '### Build verified; push failed: missing REPLICATE_CLI_AUTH_TOKEN' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          [[ "$MODEL_NAME" =~ ^[A-Za-z0-9_-]+/[a-z0-9_-]+$ ]] || { echo '::error::Expected owner/model'; exit 1; }
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          if [[ -n "$API_TOKEN" ]]; then
            echo 'api_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'api_ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::REPLICATE_API_TOKEN is absent. Push will run; cloud API smoke test will be skipped.'
          fi
      - name: Verify target Replicate model
        if: steps.publish.outputs.api_ready == 'true'
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: python scripts/replicate_smoke.py --model "$MODEL_NAME" --check-model --report reports/pre-push-model.json
      - name: Authenticate and push container
        if: steps.publish.outputs.ready == 'true'
        env:
          REPLICATE_CLI_AUTH_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
        run: |
          printf '%s' "$REPLICATE_CLI_AUTH_TOKEN" | cog login --token-stdin
          cog push "r8.im/$MODEL_NAME" --json > reports/push.json
      - name: Verify the exact immutable pushed image offline
        if: steps.publish.outputs.ready == 'true'
        run: |
          IMAGE_REF=$(python -c 'import json; print(json.load(open("reports/push.json"))["image"])')
          docker run --rm --network none --entrypoint python -v "$PWD/reports:/reports" "$IMAGE_REF" scripts/verify_offline.py --device cpu --image-size 640 --output /reports/pushed-offline.json
          docker run --rm --network none --entrypoint python "$IMAGE_REF" -m pip freeze > reports/pushed-runtime-requirements.txt
      - name: Smoke-test published API in both output modes
        if: steps.publish.outputs.api_ready == 'true'
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: python scripts/replicate_smoke.py --model "$MODEL_NAME" --image examples/sample.jpg --push-result reports/push.json --previous-model reports/pre-push-model.json --report reports/replicate.json
      - name: Summarize publication
        if: steps.publish.outputs.ready == 'true'
        env:
          API_READY: ${{ steps.publish.outputs.api_ready }}
        run: |
          echo '### Published; exact pushed image verified offline' >> "$GITHUB_STEP_SUMMARY"
          printf 'Model: https://replicate.com/%s\n' "$MODEL_NAME" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$API_READY" == true ]]; then
            echo 'Cloud PNG/ZIP API smoke tests passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Cloud API smoke tests pending REPLICATE_API_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-and-publish-reports
          path: reports/
          retention-days: 14
