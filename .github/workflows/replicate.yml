name: Build and publish to Replicate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # GPU image unpacks to ~14 GB and cog's chunked push exports a ~26 GB
      # tar. The runner is a single 72 GB disk, so trim it as far as possible.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/az /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /usr/lib/jvm /opt/microsoft
          sudo apt-get clean
          sudo docker image prune -af
          sudo docker builder prune -af
          df -h /

      # Layers, build cache and the cog export tar all default to the root disk.
      - name: Relocate Docker storage and TMPDIR to /mnt
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service
          sudo mkdir -p /etc/docker /mnt/docker /mnt/tmp
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo rm -rf /var/lib/docker
          sudo systemctl start docker.service
          sudo chown "$(id -u):$(id -g)" /mnt/tmp
          docker info --format 'docker root: {{.DockerRootDir}}'
          df -h / /mnt

      - name: Install cog CLI
        run: |
          sudo curl -o /usr/local/bin/cog -L \
            https://github.com/replicate/cog/releases/download/v0.23.1/cog_Linux_x86_64
          sudo chmod +x /usr/local/bin/cog
          cog --version

      # weights are gitignored, fetch them so they are in the build context
      - name: Fetch model weights
        run: python3 scripts/prepare_assets.py

      - name: Build cog image
        env:
          DOCKER_BUILDKIT: 1
          TMPDIR: /mnt/tmp
        run: cog build -t r8.im/asyasyarif/object-counter

      # The export tar is ~26 GB and the runner's single 72 GB disk holds it,
      # the image layers and the BuildKit cache at once. Drop the cache first.
      - name: Drop build cache before export
        run: |
          sudo docker builder prune -af
          df -h / /mnt

      - name: Push to r8.im
        env:
          COG_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
          # cog exports the image to a tar before uploading; keep it off /
          TMPDIR: /mnt/tmp
          # chunked multipart push; docker's single-request layer upload
          # hits the registry/CDN body limit on multi-GB CUDA layers
          # ("unknown blob")
          COG_PUSH_OCI: "1"
        run: |
          echo "$COG_TOKEN" | cog login --token-stdin
          cog push r8.im/asyasyarif/object-counter
