name: Build and publish to Replicate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # GPU image unpacks to ~14 GB and cog's chunked push exports a ~26 GB tar.
      # The stock runner only has ~30 GB free, so the build dies with
      # "no space left on device". This is the standard big-image cleanup.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/az \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      - name: Install cog CLI
        run: |
          sudo curl -o /usr/local/bin/cog -L \
            https://github.com/replicate/cog/releases/download/v0.23.1/cog_Linux_x86_64
          sudo chmod +x /usr/local/bin/cog
          cog --version

      # weights are gitignored, fetch them so they are in the build context
      - name: Fetch model weights
        run: python3 scripts/prepare_assets.py

      - name: Build cog image
        env:
          DOCKER_BUILDKIT: 1
        run: cog build -t r8.im/asyasyarif/object-counter

      - name: Push to r8.im
        env:
          COG_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
          # chunked multipart push; docker's single-request layer upload hits the
          # registry/CDN body limit on multi-GB CUDA layers ("unknown blob")
          COG_PUSH_OCI: "1"
        run: |
          echo "$COG_TOKEN" | cog login --token-stdin
          cog push r8.im/asyasyarif/object-counter
