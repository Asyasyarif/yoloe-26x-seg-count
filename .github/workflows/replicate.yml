name: Build and publish to Replicate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install cog CLI
        run: |
          sudo curl -o /usr/local/bin/cog -L \
            https://github.com/replicate/cog/releases/download/v0.23.1/cog_Linux_x86_64
          sudo chmod +x /usr/local/bin/cog
          cog --version

      # weights/yoloe-26x-seg.pt and mobileclip2_b.ts are gitignored, so they must be
      # fetched into the workspace before the build context is created.
      - name: Fetch model weights
        run: python scripts/prepare_assets.py

      - name: Build cog image
        env:
          DOCKER_BUILDKIT: 1
        run: cog build -t r8.im/asyasyarif/object-counter

      - name: Push to r8.im
        env:
          COG_TOKEN: ${{ secrets.COG_TOKEN }}
        run: |
          echo "$COG_TOKEN" | cog login --token-stdin
          cog push r8.im/asyasyarif/object-counter
